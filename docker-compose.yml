name: transaccion_tarjetas

services:
  postgres:
    image: postgres:17
    container_name: fincard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fincard_db
      POSTGRES_USER: fincard
      POSTGRES_PASSWORD: &fincard-db-password fincard123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fincard-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: fincard-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  kafka:
    image: apache/kafka:4.1.2
    container_name: fincard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

  authorization-service:
    build:
      context: ./authorization-service
      dockerfile: Dockerfile
    image: fincard-authorization:1.0
    restart: on-failure
    depends_on:
      - postgres
      - redis
      - kafka
      - keycloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fincard_db
      SPRING_DATASOURCE_USERNAME: fincard
      SPRING_DATASOURCE_PASSWORD: *fincard-db-password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/fincard
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fincard/protocol/openid-connect/certs

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    image: fincard-audit:1.0
    restart: on-failure
    depends_on:
      - postgres
      - kafka
    environment:
      AUDIT_DB_URL: jdbc:postgresql://postgres:5432/fincard_db
      AUDIT_DB_USER: fincard
      AUDIT_DB_PASSWORD: *fincard-db-password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  kafka_data:
