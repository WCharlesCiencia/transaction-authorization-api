# Application
spring.application.name=authorization-service
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/fincard_db
spring.datasource.username=fincard
spring.datasource.password=fincard123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

#security oauth2 with Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/fincard

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoint.health.show-details=always

#Logs
logging.level.org.springframework.security=TRACE


# Apache Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Serializaci�n de eventos
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Confirmaci�n de recepcion del broker
spring.kafka.producer.acks=all

# Reintentos seguros del productor
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Topic de autorizacion
app.kafka.topics.transaction-events=transaction-events
