# Application
spring.application.name=authorization-service
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/fincard_db
spring.datasource.username=fincard
spring.datasource.password=fincard123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

#security oauth2 with Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/fincard

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoint.health.show-details=always

#Logs
logging.level.org.springframework.security=TRACE
