spring.application.name=audit-service
spring.config.import=optional:file:./application-db.local.properties

spring.datasource.url=${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/fincard_db}
spring.datasource.username=${AUDIT_DB_USER:fincard}
spring.datasource.password=${AUDIT_DB_PASSWORD:${audit.db.local-password:}}
spring.flyway.enabled=true
spring.flyway.default-schema=audit
spring.flyway.schemas=audit
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=audit

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${AUDIT_KAFKA_GROUP_ID:audit-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.fincard.audit.event.TransactionEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=record
app.kafka.topics.transaction-events=${TRANSACTION_EVENTS_TOPIC:transaction-events}
